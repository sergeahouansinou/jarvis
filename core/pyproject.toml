[project]
name = "jarvis-core"
version = "0.1.0"
description = "Noyau de Jarvis : pipeline vocal, memoire persistante, agent 100% local."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "websockets>=13",
    "python-dotenv>=1.0",
    # --- inference locale, Apple Silicon (Metal / memoire unifiee) ---
    "mlx>=0.21",
    "mlx-lm>=0.20",
    "mlx-whisper>=0.4",
    "mlx-embeddings>=0.0.3",
]

[project.optional-dependencies]
# Detection de mot-declencheur. Optionnel : sans elle, Jarvis ecoute en
# push-to-talk / mode continu au lieu d'attendre son nom.
wake = ["openwakeword>=0.6"]
# Synthese vocale neuronale. Sans elle, repli sur `say` (macOS), qui marche.
voice = ["kokoro-onnx>=0.4", "soundfile>=0.12"]
# Embeddings alternatifs via PyTorch (~2,5 Go). Inutile si mlx-embeddings marche.
torch-embed = ["sentence-transformers>=3.0"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
